repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-yaml
      # LICENSES/ holds VERBATIM copies of canonical license texts, fetched from the
      # bodies that publish them. A formatting hook that "fixes" one of those is editing a
      # legal document to match a house style, and a license text that differs from the
      # canonical one is worth less than no copy at all.
      - id: end-of-file-fixer
        exclude: ^LICENSES/
      - id: trailing-whitespace
        exclude: ^LICENSES/
  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.47.0
    hooks:
      - id: markdownlint-fix
  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v3.1.0
    hooks:
      - id: prettier

  # -------- go related linter --------
  # The bootstrap compiler is a Go module in the go.work workspace; golangci-lint
  # runs the formatters and linters across the workspace (config: .golangci.yaml).
  - repo: https://github.com/golangci/golangci-lint
    rev: v2.12.2
    hooks:
      # target the workspace module explicitly: at the repo root go.work has no
      # module of its own, so the default './...' pattern would find nothing.
      - id: golangci-lint-fmt
        args: [./src/bootstrap/...]
      - id: golangci-lint
        args: [./src/bootstrap/...]

  # -------- security related linter --------
  - repo: https://github.com/zricethezav/gitleaks
    rev: v8.30.0
    hooks:
      - id: gitleaks
        # run the detect mode and show all the leak credentials
        entry: gitleaks detect --verbose --redact
