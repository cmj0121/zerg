# Continuous integration for the Zerg toolchain.
#
# The pipeline mirrors the bootstrap -> MVP flow end to end:
#   1. build the Go-hosted bootstrap seed (bin/zerg0)
#   2. check the seed works (its Go test suite)
#   3. check the runtime works, as C — the scheduler's only race gate
#   4. build the MVP example programs WITH that seed
#   5. check every example is workable — compiled to a native binary and run
#   6. build the self-hosting compiler, which is the seed's whole reason to exist
#   7. run the test-data corpus with that compiler
#
# Two gates run beside it, each answering a question the pipeline above cannot: that the
# compiler still compiles itself to the same C (`fixpoint`), and that the concurrency
# corpus is clean under the sanitizers (`sanitizers`).
#
# It runs on Linux (x86_64) and macOS (arm64) so both the portable POSIX-C runtime
# and both coroutine context-switch asm variants (ctx_x86_64.S / ctx_arm64.S) are
# exercised — the same C codegen target that lets Zerg cross-compile through `cc`.
#
# ThreadSanitizer is deliberately absent. It builds and runs — the fiber annotations in
# zergrt.h are there for it — but the park protocol has a coroutine take a channel's lock
# and the SCHEDULER release it once that coroutine is off the CPU, and TSan counts fibers
# as threads, so it stops deriving happens-before from a mutex released by someone other
# than its owner and then reads every access under that lock as a race. Its reports are
# output about a model that does not fit, not findings; src/runtime/README.md sets out what
# it would take to change that. A job producing them would be a job nobody reads.
name: CI

on:
  push:
    branches: [main]
  pull_request:

  # AND A RELEASE CALLS THIS ONE. `release.yml` used to define its own board job and say in a
  # comment that it ran "the same gates as CI" — which was a sentence, not a mechanism, and it
  # was wrong on the first tag: it ran `make test`, the whole board, where the steps below
  # guard nine gates behind the private corpus being fetchable. Nine failed and nothing was
  # published. Being callable is what makes the claim true by construction.
  workflow_call:

permissions:
  contents: read

concurrency:
  # A release must not be cancelled by a later push, so the group carries the ref that started
  # it and in-progress cancellation is off for a tag.
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  # A stale `docs/…md` path has NO other signal: most of them are plain-text citations
  # in source comments, which markdownlint, prettier and every link checker are blind
  # to. If CI does not catch it, nothing does — so this runs on its own, needs no
  # toolchain, and finishes in seconds.
  docs-links:
    name: docs links resolve
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check every docs path the repo cites
        run: make docs-links
  docs-mirror:
    name: docs links resolve
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check every docs path the repo cites
        run: make docs-mirror

      # Same job, same reason: a GRAMMAR citation is a plain-text mention no tool
      # but this one reads. It needs the same nothing — no toolchain, no submodule.
      - name: Check every GRAMMAR citation the repo makes
        run: make grammar-cites

      # And the productions the prose companion copies out of GRAMMAR, in both
      # languages — a second copy of a language fact, with nothing else reading it.
      - name: Check the grammar's prose companion against GRAMMAR
        run: make grammar-mirror

      # Every reserved word must be reached by some production. A keyword the grammar
      # never mentions is one whose entire effect is to forbid a name — which is what
      # `package` had been doing for years.
      - name: Every reserved word is reached by the grammar that reserves it
        run: make grammar-keywords

      # What each stage is ALLOWED to know: the parser sees tokens only, and inference
      # runs bottom-up over four named carve-outs. Both are claims about what the code
      # may reach, so both are read out of the sources rather than run.
      - name: Each stage knows only what it is allowed to know
        run: make layering

      # A bare `{ … }` is the block form with no keyword in front of it, and therefore the
      # arm a hand-written match forgets. Ten walks had, and the answers ranged from a
      # legal program refused to generated C reaching cc. Read out of the sources, like
      # the step above, because what it asserts is which arms a match has.
      - name: A walk that reaches into a block reaches into a bare one
        run: make stmt-walk

      # The examples had no door for as long as they existed. This is the one direction the
      # drift goes once they have one: an example the glob builds and the index never names.
      - name: Every example is named in the index a reader opens
        run: make examples-index

      # 2.4 GB to produce 3.6 MB of C, rediscovered by hand twice. The ceiling is a regression
      # alarm for the accumulation shape, not a target.
      - name: The compiler emits its own C under a memory ceiling
        run: make mem-peak

      # A release's body is rendered from the changelog on the day of the tag. This asks the
      # invariant behind that every day instead: the changelog has a section for the version
      # this build reports.
      - name: The changelog has a section for the version being built
        run: make release-notes

      # A code is an identity, and an identity nothing checks is a number. This holds
      # the compiler's codes, the gates that assert them, and the catalogue a reader
      # looks them up in to being one set.
      - name: Every error code is reported once, asserted, and listed
        run: make error-codes-check

      # The seed's gap list is the contract a `seed-gap` case is excused against, so a
      # reader of either language needs it. The zh-TW page had NO gap section at all while
      # the English one had 27 entries — nobody decided that, it drifted one entry at a
      # time, and nothing was watching.
      - name: The seed's gap list says the same thing in both languages
        run: make seed-gaps

      # A `[deviation]` is the specification saying the compiler does something else and we
      # know. The failure mode this guards is not the marker, it is the silence: a release
      # that meets "no deviations" by deleting markers rather than by fixing compilers.
      - name: Every deviation names a ticket, and the inherited list is honest
        run: make deviation-check

      # An `E9xxx` is a form the LANGUAGE has and this compiler does not build. A reader meets
      # that in the chapter or in a refusal, and only the first comes before they write the
      # program — so the catalogue alone is not where it belongs (#74).
      - name: Every unbuilt form is named where its readers are
        run: make chapter-codes

      # And the board itself: a gate the workflow never runs is a gate that finds
      # nothing. This is the check that would have caught the nine that were green
      # only when somebody thought to type them.
      - name: Every gate is on the board, and the board is run
        run: make gates

  bootstrap-and-examples:
    name: bootstrap + examples (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: src/bootstrap/go.mod
          cache-dependency-path: src/bootstrap/go.sum

      # --- 1. create and build the bootstrap -------------------------------------
      - name: Build the bootstrap toolchain
        run: make -C src/bootstrap build

      - name: Smoke-check the bootstrap binary
        run: ./bin/zerg0 --help

      # --- 2. check the bootstrap is working -------------------------------------
      - name: Test the bootstrap
        run: make -C src/bootstrap test

      # --- 3. check the runtime is working, as C ---------------------------------
      # This suite compiles csrc/ with the host cc and runs it, which is the only place
      # the runtime is exercised as C rather than as a by-product of a Zerg program. It
      # holds TestSchedulerCompilesAndRuns, TestChannelsCompileAndRun and
      # TestConcurrencyStress — the scheduler's only race gate — and it had never run on
      # CI, on either platform, though the root fan-out — `make suites` — has reached it
      # since the day src/runtime/Makefile existed.
      - name: Test the runtime
        run: make -C src/runtime test

      # --- 4. the seed's actual contract: it builds the self-hosting compiler ----
      # Nothing else in this pipeline exercises src/compiler/, so a seed change that
      # breaks the one thing the seed exists for would otherwise pass CI.
      - name: Build the self-hosting compiler with the seed
        run: make build

      # --- 4b. and both of them say the same thing about which version they are --
      # Immediately after `make build`, because this gate reads bin/ instead of filling it;
      # scripts/version-check.sh says what it compares and why nothing else here can.
      - name: The version is one number in one file
        run: make version-check

      # --- 5. build every example with the compiler that SHIPS, then run it ------
      # This step used to inline its own loop and drive `zerg0`, which made it a
      # gate on the SEED — and the seed is deliberately the narrower compiler. Four
      # examples say so in their own header comment (`11_coroutines`, `12_actor`,
      # `13_cancel` are concurrency, `14_optional` needs the implicit `nil` for an
      # omitted `T?` field), so the loop failed on exactly the examples that were
      # right. `make examples` is the same corpus built by `zerg`, with the two
      # demos `zerg` cannot build yet named there rather than here — one list, in
      # the Makefile, where the reasons are written down.
      - name: Build & run all examples
        run: make examples

      # --- 7. the programs the toolchain must turn away --------------------------
      # It runs here, right after the compilers are built, because it needs both of them
      # and no corpus. What it pins is that a refusal comes from the compiler, naming the
      # source, rather than from cc naming generated C — which a build gate cannot see,
      # since a program that reaches cc and is rejected there still "fails".
      - name: Every program that must be refused, is
        run: make refuse

      # --- 7b. the programs that are not Zerg at all -----------------------------
      # `refuse` covers forms this compiler has not built. This covers programs the
      # LANGUAGE rejects — a write to an immutable binding, and the rest of the rules the
      # self-hosting compiler shipped without. Every other job here compiles well-formed
      # programs only, which is why that whole class went unseen.
      - name: Every program that is not Zerg, is rejected
        run: make reject

      # --- 7b''. the values that outlive their scope -----------------------------
      # The leak gate that needs neither LeakSanitizer nor the private corpus, which is
      # why it is HERE — on both platforms, on every fork — rather than beside
      # `sanitize-conc` in the Linux-only job that has been this repository's single
      # source of leak signal. Its programs are written in the script, the way `refuse`
      # and `reject` above write theirs.
      - name: No value outlives the scope that made it
        run: make mem-check

      # --- 7b'. the compiler's own sources are canonical -------------------------
      # fmt-corpus and fmt-tokens both need the private corpus, so the formatter's rules
      # were never checked against the largest body of Zerg that exists — the compiler.
      # Three deviations landed in one branch before this ran anywhere.
      - name: The compiler and the stdlib are fmt's fixpoint
        run: make fmt-self

      # An editor file repeats a language fact — a keyword list, an indent character —
      # because it must, so it is the one place that needs a diff rather than a call. It
      # runs here rather than in the docs job because it asks `zerg fmt` what an indent is,
      # and that needs a built toolchain.
      - name: No editor file states a language fact the compiler denies
        run: make editor-align

      # The chapters' own code blocks, for the same reason and in the same place: a
      # ` ```zerg ` fence is a claim about its contents that only the compiler can settle,
      # so it needs the toolchain and cannot sit in the docs job with docs-links and
      # docs-mirror. Those two compare text to text; this one compiles.
      - name: Every ```zerg block in the docs is a program
        run: make docs-zerg

      # The linter over the compiler and the stdlib — the only bodies of Zerg large
      # enough for a dead private function to hide in — and the check that every rule
      # it documents still has a program that makes it fire.
      - name: Lint the compiler and the stdlib with zerg itself
        run: make lint

      - name: Every linter rule has a program that makes it fire
        run: make lint-check

      - name: The document is every exposed declaration, and no more
        run: make doc-check

      # The cache is keyed by the compiler that filled it. Two compilers, two keys —
      # otherwise a stale object outlives the compiler that produced it.
      - name: The build cache names the compiler that filled it
        run: make cache-key-check

      # `make install` also teaches cloc the Zerg language, and `install-check` holds it to
      # counting some — so cloc has to BE here. It is installed rather than checked for
      # because the check it would replace is a skip, and a skipped assertion is green on
      # exactly the machine where the definition was never read.
      - name: Install cloc (linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y cloc

      - name: Install cloc (macos)
        if: runner.os == 'macOS'
        run: brew install cloc

      # `make install` puts a toolchain on the machine and `make uninstall` takes it
      # away; this is the gate that runs both and compiles from the installed path.
      - name: The installed toolchain works, and uninstall takes it away
        run: make install-check

      # The unit suites, which `make examples` above does not reach: the Go seed's
      # tests and the runtime's C tests. It answered to `make test` until that name
      # became the whole board; a step here runs one gate, never the board.
      - name: Unit suites, seed and runtime
        run: make suites

      # And the runner those suites will eventually be written in. A test runner that
      # cannot detect a failing test is the ultimate gate that measures nothing, so this
      # asks it about the four ways a test fails to hold — a broken assertion, a crash, an
      # early `os.exit`, and a tree with no tests at all.
      - name: The test runner can see a test that fails
        run: make test-runner

      # And the suites written for it. A suite nobody runs is worse than none — it makes a
      # reader believe there is coverage — so the standard library's own tests are a step of
      # their own, with a floor under how many of them ran.
      - name: The standard library's own suites
        run: make stdlib-test

      # The digest that names every cached object, held to FIPS 180-4's vectors and to the
      # system tool. It needs a built compiler, which is why it is here and not in the
      # text-only job.
      - name: The pure-Zerg digest is the digest everyone else computes
        run: make sha256

      - name: Fetch test-data submodule
        id: corpus_fetch
        env:
          TESTDATA_TOKEN: ${{ secrets.TESTDATA_TOKEN }}
        run: ./scripts/ci-fetch-testdata.sh corpus

      # --- 7b''. and the two compilers agree about the programs that ARE Zerg ----
      # `reject` makes the seed the oracle for what must be turned away. Nothing asked the
      # same question about what must be ACCEPTED, so `int("42")` parsed a string in the
      # seed and cast the string's POINTER in the compiler that ships — two different
      # answers to one program, under a full board of green gates.
      #
      # AFTER the fetch, and not before it: the target passes the corpus as a glob, so
      # running it earlier compared the 12 examples and silently nothing else — three
      # quarters of the programs it pays a rebuild for. It is deliberately not gated on
      # `available`, because the examples half works on a fork with no corpus at all.
      - name: The seed and the shipping compiler agree
        run: make oracle

      # --- 7b'''. and the second implementation of GRAMMAR reads them too ---------
      # The tree-sitter grammar is the one thing here that cannot be held to the compiler by
      # calling it — it is a second implementation of GRAMMAR — so it is held to a corpus:
      # every `.zg` file in the tree parses with no ERROR and no MISSING node.
      #
      # AFTER the fetch, and not before it, for the third time on this board and for the
      # same reason `oracle` and `fmt-corpus` are: the target passes `test-data/codegen`
      # and `test-data/fmt` as globs, so up beside `editor-align` it read the 57 files that
      # are IN this repository and silently none of the 189 that are not. That is not a
      # quieter gate, it is a red one — the floor exists precisely to refuse a run that
      # measured a fraction of what it names, and it did.
      #
      # Deliberately not gated on `available`, like `oracle`: the in-tree half is a real
      # corpus on a fork with no credentials, and a grammar that cannot read the compiler's
      # own sources should turn a fork's board red too.
      - name: The tree-sitter grammar reads every Zerg file in the tree
        run: REQUIRE=1 make treesitter

      # --- 7c. and the ones nobody wrote by hand ---------------------------------
      # The reject list holds the mistakes somebody thought of. This breaks the corpus's
      # working programs and holds the results to the same contract, which is how an enum
      # payload whose type was not a type name was found.
      - name: Break the working programs and hold the contract
        if: steps.corpus_fetch.outputs.available == 'true'
        run: make reject-fuzz

      # --- 7c'. and the two STAGES agree about all of them ------------------------
      # `--emit check` runs the rules without lowering the program to C, which is what the
      # language server asks on every keystroke batch. The danger of a second answer is not
      # that it is slow but that it is SHORTER: an editor that paints a clean buffer for a
      # file which will not build is worse than one that takes six seconds. Same corpus,
      # same mutations, and the two stages must print the same findings byte for byte.
      - name: The check stage finds what the build finds
        if: steps.corpus_fetch.outputs.available == 'true'
        run: make check-equal

      # And the same question one step out: does the OUTPUT depend on how the build was
      # invoked. `zerg build src/…/zergc.zg` and the same file named absolutely are one
      # program, and the C used to differ by 450 KB with the module tags shifted. It needs
      # the toolchain, so it rides here rather than with the source-reading gates.
      - name: The same program, however its entry was spelled
        run: make entry-path

      # --- 7c'. every GRAMMAR chapter is read, or refused by name ---------------
      # test-data/conformance is one file per chapter of GRAMMAR — every form it derives,
      # written once — and no runner, no target and no test named it, so 375 lines of
      # corpus said "this is the language" to nobody. Gated on `available` like its
      # neighbours: the twelve files live in the private corpus.
      - name: Every GRAMMAR chapter is read, or refused by name
        if: steps.corpus_fetch.outputs.available == 'true'
        run: make conformance

      # --- 7c''. and every PRODUCTION, not merely every chapter ------------------
      # A chapter file stops at its first refusal, so the step above measures at most
      # twelve of GRAMMAR's 171 productions — and two of its files were masking `mut &`
      # and `unsafe fn`, forms it had therefore never once put to the compiler. One
      # sample per production, one production per file. Gated on `available` like its
      # neighbours: the samples live in the private corpus.
      - name: Every GRAMMAR production is read, or refused by name
        if: steps.corpus_fetch.outputs.available == 'true'
        run: make productions

      # --- 7c'''. and what GRAMMAR does NOT derive is refused ---------------------
      # Every step above asks about programs that ARE Zerg, so none of them can see an
      # over-acceptance. That blind spot held a 1-tuple `(1, )`, a trailing comma in four
      # bracket kinds, `0x_1F`, a `{`-opening head, `?? raise … if`, and a comma that was
      # optional in nine readers. Gated on `available`: the cases live in the private
      # corpus.
      - name: A program GRAMMAR does not derive is refused
        if: steps.corpus_fetch.outputs.available == 'true'
        run: make counterexamples

      # --- 7d. the formatter's own corpus ---------------------------------------
      # Every case is already canonical, so a change in layout shows up as a diff rather
      # than as a passing run.
      #
      # AFTER the fetch, with its neighbours, and not up beside `fmt-self`: test-data/fmt
      # is in the private corpus, so running it earlier met the submodule guard and failed
      # the job outright on both platforms — a gate that had never run anywhere was put on
      # the board in the one spot where its cases do not exist yet.
      - name: Every fmt case is already canonical
        if: steps.corpus_fetch.outputs.available == 'true'
        run: make fmt-corpus

      # --- 7d'. formatting changes spacing, never meaning -----------------------
      # `fmt --check` and idempotence are both blind to a rule that is stably WRONG. This
      # is the property that is not: the token stream must survive being formatted.
      - name: Formatting does not move a token
        if: steps.corpus_fetch.outputs.available == 'true'
        run: make fmt-tokens

      # --- 7d''. what the formatter writes, the parser reads ---------------------
      # The three steps above ask whether a source is already canonical and whether spacing
      # moved a token — and `fmt-tokens` asks its question with the F4xx REWRITES off. So
      # the rules that change the code's shape were measured by nothing, and F401 spent
      # months turning `if s := v { return s }` into a file that does not parse while all
      # three stayed green. This runs every rule and asks whether the output is a program.
      - name: The formatted result still parses
        if: steps.corpus_fetch.outputs.available == 'true'
        run: make fmt-roundtrip

      # --- 8. the corpus the self-hosting compiler owns --------------------------
      # `test-data` is a PRIVATE repository, so the anonymous HTTPS rewrite below cannot
      # reach it and the fetch fails. Under `continue-on-error` that failure was reported
      # as a SUCCESSFUL step while `outcome` kept `failure` — and the gate read `outcome`,
      # so `make corpus` has been skipped on every run since this job was written, inside
      # a job that went green. A gate nobody can tell is not running is worse than no
      # gate: it reads as coverage it never had.
      #
      # The fetch now says which world it is in. With TESTDATA_TOKEN configured the corpus
      # is REQUIRED and a broken fetch fails the job. Without it — a fork, or this repo
      # before the secret exists — the run carries a warning annotation naming the gate
      # that did not run, so a green check no longer implies the corpus passed.

      - name: Run the corpus with the self-hosting compiler
        if: steps.corpus_fetch.outputs.available == 'true'
        run: make corpus

      # --- 8b. the sugar and the core it is defined as ---------------------------
      # Every gate above compiles each program ONE way. GRAMMAR defines `return x if c`, a
      # while-`for` and a range-`for` as something else, the emitter lowers each surface
      # form directly, and so the core form those definitions name goes down a path nothing
      # here had ever taken. This desugars a copy of the whole corpus and compares the two.
      - name: A program and the same program desugared do the same thing
        if: steps.corpus_fetch.outputs.available == 'true'
        run: make desugar

      # --- 8c. the second front end -----------------------------------------------
      # `zerg lsp` answers an editor with the same compiler `zerg build` answers a shell
      # with, and this is that sentence as a gate: a real stdio session per file, held to
      # what the command line says about it. It also drives the wire, which nothing else
      # in this repository does.
      - name: The language server says what the compiler says
        if: steps.corpus_fetch.outputs.available == 'true'
        run: make lsp

  # The C dialect the emitted code is compiled with. `-std=c17` is the default and what
  # every other job here uses, so this exists for the OTHER leg: the specification names
  # C99 as the fallback, and until this job the fallback had never been compiled once —
  # `max_align_t` is a C11 typedef, and the runtime's list buffer asked for it.
  #
  # It is a matrix over both rather than a c99-only job so that the flag is what is pinned
  # and not the default: a change to `cc_std`'s default would otherwise move this gate's
  # meaning without touching this file.
  #
  # `make examples` and not `make build` alone, because a dialect that miscompiles rather
  # than failing to compile is caught by RUNNING a program, and the examples are the corpus
  # that needs no submodule. Locally this is `ZERG_CSTD=c99 make examples`; the cache keys
  # objects by dialect, so the two do not hand each other's objects back.
  #
  # Linux, because a dialect is mostly a question about the platform's headers and glibc's
  # feature-test macros are where that question has teeth. macOS runs the default c17 leg
  # in the job above.
  dialects:
    name: the emitted C compiles as ${{ matrix.cstd }} (linux)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        cstd: [c17, c99]
    env:
      ZERG_CSTD: ${{ matrix.cstd }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: src/bootstrap/go.mod
          cache-dependency-path: src/bootstrap/go.sum

      - name: Build the toolchain, emitted C compiled as ${{ matrix.cstd }}
        run: make build

      - name: Build & run every example as ${{ matrix.cstd }}
        run: make examples

  # The compiler compiles itself, so a codegen change that makes it emit subtly different
  # C for its own source has no other signal: every corpus case still passes, because the
  # one program large enough to reach a rare emitter path is the compiler. `make build`
  # already builds the two stages this compares and threw the intermediate away.
  #
  # One platform is enough. The property under test is that a compiler reproduces its own
  # output, which is a property of the emitter and not of the host; the two hosts are
  # already compared by everything else in this file. It needs no corpus and builds its
  # stages into a temp directory of its own, so it runs on a bare checkout.
  fixpoint:
    name: the compiler is a fixpoint of itself
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: src/bootstrap/go.mod
          cache-dependency-path: src/bootstrap/go.sum

      - name: Build the compiler twice and compare what it emits
        run: make fixpoint

  # `make corpus` checks what the concurrency cases PRINT, and a stack freed under a live
  # fiber or a channel the scheduler forgot on the way out changes nothing it can see: the
  # program prints the right numbers and leaves the damage behind. This rebuilds those same
  # cases against AddressSanitizer, UndefinedBehaviourSanitizer and LeakSanitizer.
  #
  # Linux, and only Linux, because LeakSanitizer does not exist on macOS — that is not an
  # oversight to correct later, it is why leaks in this repo have historically been found
  # here and not on a developer's machine. The address and UB halves do run on macOS
  # through `make -C src/runtime test`, which the job above now runs on both platforms.
  sanitizers:
    name: concurrency corpus under the sanitizers (linux)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: src/bootstrap/go.mod
          cache-dependency-path: src/bootstrap/go.sum

      # Same fetch as the corpus above, and the same history: this gate has never run.
      # It matters more here than there, because LeakSanitizer does not exist on macOS —
      # this job is the ONLY leak signal the concurrency path has, and it has been
      # reporting success without building a single case.
      - name: Fetch test-data submodule
        id: corpus_fetch
        env:
          TESTDATA_TOKEN: ${{ secrets.TESTDATA_TOKEN }}
        run: ./scripts/ci-fetch-testdata.sh sanitize-conc

      - name: Build every conc_* case with the sanitizers on, and run it
        if: steps.corpus_fetch.outputs.available == 'true'
        run: make sanitize-conc
