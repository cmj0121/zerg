# The release flow for the Zerg toolchain.
#
# WHAT A TAG BUYS THAT CI DOES NOT. CI runs on `main` and on every pull request, so a tag can
# still point at a commit CI never saw: a cherry-pick, an amend, a merge made locally. This
# re-runs the board ON THE TAGGED COMMIT, and publishes nothing until it is green.
#
# THE SAME GATES AS CI, and this workflow CALLS `ci.yml` rather than restating it. That is the
# difference between a claim and a mechanism, and the first tag proved it: the board job here
# was written by hand, said in a comment that it ran the same gates, and ran `make test`
# instead — the whole board, where `ci.yml` guards nine gates behind the private corpus being
# fetchable. Nine failed, nothing was published, and the comment was the only thing that had
# said otherwise.
#
# A gate nobody sees every day is a gate that speaks for the first time on the day it must not,
# so anything worth checking belongs in `ci.yml` where it runs on every push. What a release
# adds is not more checks; it is the same checks on the commit the tag names.
#
# WHAT SHIPS is a per-platform tarball, because `bin/zerg` is not self-contained: a build ends
# in `cc`, and the compiler reads the runtime's C sources and the standard library at run time.
# `make install` decides what an installed toolchain is, and `scripts/release-tarball.sh` stages
# one and tars it — so the contents are never a second list.
#
# THREE PLATFORMS, ALL NATIVE. The seed is Go and cross-compiles, but `bin/zerg` is produced by
# compiling Zerg to C and handing it to `cc`, so each platform's compiler is built on that
# platform.
#
# THERE IS NO INTEL-MAC TARBALL, and the answer for that platform is the Homebrew formula rather
# than a fourth runner. `Formula/zerg.rb` builds from source, so it works wherever Go and a C
# compiler do — and a runner label is a thing that gets retired, while building from source is
# not. #33 decided four platforms and three shipped; this is that decision, corrected and
# written down where the matrix is.
#
# AND A TARBALL THAT FAILS ITS SMOKE TEST IS NOT PUBLISHED. `install-check` runs `make install`
# from the repository, with a checkout and a Go toolchain standing behind it. Nothing had ever
# tested the thing that gets DOWNLOADED, so `make release` is the pair — build the artifact,
# then unpack it somewhere with nothing else and build a program with it.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # --- 1. the tag is the version, before anything expensive ------------------------------
  #
  # THE FIFTH DERIVATION OF VERSION, and the only one a human types. Asserted in a job of its
  # own so a mistyped tag costs two minutes rather than a full board on two runners and three
  # tarballs named after a version nobody asked for.
  tag:
    name: the tag is the version
    runs-on: ubuntu-latest

    steps:
      - name: Checkout the tag
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: src/bootstrap/go.mod
          cache-dependency-path: src/bootstrap/go.sum

      # `version-check` reads what is in bin/ rather than filling it, which is why it has to
      # run after a build and why the Makefile and CI sequence it exactly there.
      - name: Build the toolchain
        run: make build

      - name: The tag is the version
        run: make version-check
        env:
          TAG: ${{ github.ref_name }}

  # --- 2. the board, on the tagged commit -------------------------------------------------
  #
  # BY CALLING CI, not by restating it. A tag can point at a commit CI never saw — a
  # cherry-pick, an amend, a merge made locally — so the board has to run on the commit the tag
  # names. What it must NOT be is a second definition of which gates those are: the first
  # attempt wrote its own job, said in a comment that it ran "the same gates as CI", and ran
  # `make test` instead — the whole board, where `ci.yml` guards nine gates behind the private
  # corpus being fetchable. Nine failed on the first tag and nothing was published, which is the
  # gate doing its job and the comment failing at its own.
  #
  # A reusable workflow makes the claim true by construction: there is one list, in one file.
  board:
    name: the board
    needs: tag
    uses: ./.github/workflows/ci.yml

  # --- 3. the artifacts, one per platform -------------------------------------------------
  artifact:
    name: tarball (${{ matrix.os }})
    needs: board
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout the tag
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: src/bootstrap/go.mod
          cache-dependency-path: src/bootstrap/go.sum

      # `make release` is the tarball AND its smoke test, in that order, so there is no way to
      # produce the first without passing the second.
      - name: Build the tarball and smoke-test it
        run: make release

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.os }}
          path: dist/
          if-no-files-found: error

  # --- 4. one release, with the checksums of everything in it -----------------------------
  publish:
    name: publish
    needs: artifact
    runs-on: ubuntu-latest

    steps:
      - name: Checkout the tag
        uses: actions/checkout@v4

      - name: Collect every platform's artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist

      # EACH RUNNER KNOWS ONLY ITS OWN. `release-tarball.sh` appends one line per artifact to a
      # SHA256SUMS beside it, so merging three of them gives three lines in one file — and
      # `sha256sum -c SHA256SUMS` then verifies whichever ones a person downloaded.
      - name: One SHA256SUMS for the release
        run: |
          cd dist
          cat SHA256SUMS | sort -k2 > SHA256SUMS.all
          mv SHA256SUMS.all SHA256SUMS
          sha256sum -c SHA256SUMS
          echo "--- publishing ---"
          ls -l

      # NOT `body_path: CHANGELOG.md`. That publishes the whole file, and most of that file is
      # ABOUT the file — where the number comes from, what belongs in `notes/`, that entries
      # are newest first — none of which is about the release somebody just clicked on. After
      # 0.2.0 it would carry every older entry along too. `release-notes.sh` extracts the
      # section for the version in VERSION and adds what a downloader asks first: which file to
      # take, how to check it arrived intact, and that `cc` is needed to build a PROGRAM.
      - name: Render the release body
        run: ./scripts/release-notes.sh > RELEASE_NOTES.md

      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/SHA256SUMS
          body_path: RELEASE_NOTES.md
          fail_on_unmatched_files: true
